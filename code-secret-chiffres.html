<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Salle RASED - Code Magique</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap');
  :root {
    --gold: #fbbf24; --gold-dark: #b45309;
    --teal: #0b7a6e; --teal-light: #14b8a6;
    --door-color: #0891b2; --frame-color: #fde047;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { 
    margin: 0; height: 100dvh; display: flex; align-items: center; justify-content: center;
    font-family: 'Nunito', system-ui, sans-serif; background: #e0f2fe; overflow: hidden; touch-action: manipulation;
  }
  .fx-layer { position: fixed; inset: 0; pointer-events: none; z-index: 2500; }
  .app { width: 100%; max-width: 420px; height: 100%; display: flex; flex-direction: column; padding: 20px; gap: 15px; }

  .door-container { perspective: 1200px; height: 320px; display: flex; justify-content: center; align-items: center; transition: all 0.8s; }
  .door-frame {
    position: relative; width: 190px; height: 270px; background: var(--frame-color);
    border-radius: 100px 100px 15px 15px; padding: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    transform-style: preserve-3d;
  }
  .door {
    position: relative; width: 100%; height: 100%; background: var(--door-color);
    border-radius: 90px 90px 10px 10px; border: 3px solid #155e75;
    transform-origin: left center; transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex; flex-direction: column; align-items: center; padding-top: 50px;
    user-select: none;
  }
  .is-open .door { transform: rotateY(-110deg); }
  .door-plaque {
    background: #2563eb; color: white; padding: 12px 18px; text-align: center;
    border-radius: 8px; font-weight: 900; border: 3px solid white; font-size: 16px;
    box-shadow: 0 6px 0 #1e3a8a; cursor: pointer; font-family: 'Fredoka One', sans-serif;
  }
  
  .panel { background: white; border-radius: 30px; padding: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
  .display { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; min-height: 24px; }
  .dot { width: 22px; height: 22px; border-radius: 50%; border: 3px solid #cbd5e1; transition: all 0.2s; }
  .dot.active { background: var(--gold); border-color: var(--gold-dark); transform: scale(1.15); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .key { height: 60px; border: none; border-radius: 15px; background: #f8fafc; font-size: 24px; font-weight: bold; box-shadow: 0 4px 0 #cbd5e1; font-family: 'Fredoka One', sans-serif; cursor: pointer; }
  .key:active { transform: translateY(2px); box-shadow: 0 2px 0 #cbd5e1; }
  .key.validate { background: #22c55e; color: white; box-shadow: 0 4px 0 #166534; }

  .teacher-access { position: fixed; top: 12px; right: 12px; z-index: 100; width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(255,255,255,.85); color: #334155; font-size: 24px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .teacher-access:focus-visible { outline: 3px solid #0b7a6e; outline-offset: 3px; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 3000; color: white; }
  .modal-content { background: #1e293b; padding: 25px; border-radius: 25px; width: 85%; max-width: 360px; }
  .modal-content label { display: block; margin-top: 10px; margin-bottom: 4px; }
  .modal-content input { width: 100%; padding: 10px; border-radius: 8px; border: none; font-size: 16px; }
  .modal-btn { width: 100%; padding: 15px; background: #22c55e; border: none; border-radius: 12px; color: white; font-weight: bold; margin-top: 10px; cursor: pointer; font-family: 'Nunito', sans-serif; font-size: 16px; }
  
  .overlay-success { position: fixed; inset: 0; background: rgba(11, 122, 110, 0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; color: white; text-align: center; }
  .overlay-success h1 { font-family: 'Fredoka One', sans-serif; font-size: 64px; margin: 0; }
  .overlay-success p { font-size: 22px; font-weight: 700; }

  @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
  @keyframes flash-red { 0%, 100% { background: var(--frame-color); } 50% { background: #fca5a5; } }
</style>
</head>
<body>

<canvas id="canvas-fx" class="fx-layer"></canvas>

<button type="button" class="teacher-access" id="teacherAccess" aria-label="Ouvrir le mode enseignant" title="Mode enseignant">⚙️</button>
<div class="app">
  <header style="text-align:center;"><h2 style="color:var(--teal); margin:0; font-family:'Fredoka One',sans-serif; font-size:28px;">CODE SECRET 🔑</h2></header>
  <div class="door-container" id="wrapper">
    <div class="door-frame" id="doorFrame">
      <div class="door"><div class="door-plaque" id="adminTrigger">SALLE<br>RASED</div></div>
    </div>
  </div>
  <div class="panel">
    <div class="display" id="display"></div>
    <div class="grid">
      <button class="key" onclick="press(1)">1</button><button class="key" onclick="press(2)">2</button><button class="key" onclick="press(3)">3</button>
      <button class="key" onclick="press(4)">4</button><button class="key" onclick="press(5)">5</button><button class="key" onclick="press(6)">6</button>
      <button class="key" onclick="press(7)">7</button><button class="key" onclick="press(8)">8</button><button class="key" onclick="press(9)">9</button>
      <button class="key" onclick="clearAll()">C</button><button class="key" onclick="press(0)">0</button><button class="key validate" onclick="validate()">OK</button>
    </div>
  </div>
</div>

<div id="modalAdmin" class="modal">
  <div class="modal-content">
    <h3>Mode Enseignant 🎓</h3>
    <label>Code :</label><input type="number" id="newCode">
    <label>Message :</label><input type="text" id="newMsg">
    <button class="modal-btn" onclick="saveSettings()">ENREGISTRER</button>
    <button class="modal-btn" style="background:#ef4444" onclick="closeAdmin()">ANNULER</button>
  </div>
</div>

<div id="overlaySuccess" class="overlay-success">
  <h1>🎉 BRAVO ! 🎉</h1>
  <p id="res-msg"></p>
  <button onclick="location.reload()" style="padding:15px 30px; font-size:18px; border-radius:30px; border:none; background:var(--gold); cursor:pointer; font-family:'Fredoka One',sans-serif;">RECOMMENCER</button>
</div>

let secretCode = localStorage.getItem('rasedCode') || "7";
let successMsg = localStorage.getItem('rasedMsg') || "Bravo !";
let currentInput = "";
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const canvas = document.getElementById('canvas-fx');
const ctx2d = canvas.getContext('2d');
let particles = [];
let applauseBuffer = null;

// Decode applause audio
(async () => {
  try {
    const bin = atob(APPLAUSE_B64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    applauseBuffer = await audioCtx.decodeAudioData(arr.buffer);
  } catch(e) { console.warn('Audio decode failed', e); }
})();

function playApplause() {
  if (!applauseBuffer) return;
  const src = audioCtx.createBufferSource();
  src.buffer = applauseBuffer;
  const gain = audioCtx.createGain();
  gain.gain.value = 0.8;
  src.connect(gain); gain.connect(audioCtx.destination);
  src.start();
  setTimeout(() => { try { src.stop(); } catch(e){} }, 4000);
}

function playWrongSound() {
  // Descending "wrong" buzzer sound
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(300, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.4);
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.4);
}

function initDisplay() {
  const display = document.getElementById('display');
  display.innerHTML = "";
  for(let i = 0; i < secretCode.length; i++) {
    const dot = document.createElement('div'); dot.className = 'dot'; display.appendChild(dot);
  }
}
initDisplay();

function press(num) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (currentInput.length < secretCode.length) {
    currentInput += num;
    updateDots();
  }
}

function clearAll() { currentInput = ""; updateDots(); }

function updateDots() {
  const dots = document.querySelectorAll('.dot');
  dots.forEach((d, i) => d.classList.toggle('active', i < currentInput.length));
}

function validate() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if(currentInput === secretCode) {
    onSuccess();
  } else {
    const f = document.getElementById('doorFrame');
    f.style.animation = "shake 0.5s, flash-red 0.5s";
    playWrongSound();
    setTimeout(() => f.style.animation = "", 500);
    clearAll();
  }
}

function playPartySound() {
  for (let i = 0; i < 10; i++) {
    setTimeout(() => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const notes = [523, 659, 784, 1047, 1319];
      osc.frequency.value = notes[i % notes.length];
      osc.type = 'triangle';
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }, i * 120);
  }
}

class Particle {
  constructor(x, y, color, type) {
    this.x = x; this.y = y; this.color = color; this.type = type;
    if (type === 'firework') {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 8 + 2;
      this.v = { x: Math.cos(angle)*speed, y: Math.sin(angle)*speed };
    } else {
      this.v = { x: (Math.random()-0.5)*5, y: Math.random()*4+1 };
    }
    this.life = 180; this.size = type === 'firework' ? 3 : Math.random()*8+4;
    this.rot = Math.random()*360; this.rotSpeed = (Math.random()-0.5)*10;
  }
  draw() {
    ctx2d.save();
    ctx2d.fillStyle = this.color;
    ctx2d.globalAlpha = this.life/180;
    if (this.type === 'confetti') {
      ctx2d.translate(this.x, this.y);
      ctx2d.rotate(this.rot * Math.PI/180);
      ctx2d.fillRect(-this.size/2, -this.size/2, this.size, this.size*0.5);
    } else {
      ctx2d.beginPath(); ctx2d.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx2d.fill();
    }
    ctx2d.restore();
  }
  update() {
    this.x += this.v.x; this.y += this.v.y;
    this.v.y += 0.08; this.v.x *= 0.99;
    this.rot += this.rotSpeed;
    this.life--;
  }
}

function launchFirework(x, y) {
  const colors = ['#fbbf24','#f472b6','#22c55e','#3b82f6','#a855f7','#f97316','#ffffff'];
  for(let i=0; i<60; i++) particles.push(new Particle(x, y, colors[i%colors.length], 'firework'));
}

function startFireworks() {
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const colors = ['#fbbf24','#f472b6','#22c55e','#3b82f6','#a855f7','#f97316'];
  
  // Initial burst
  launchFirework(canvas.width*0.3, canvas.height*0.3);
  launchFirework(canvas.width*0.7, canvas.height*0.3);
  launchFirework(canvas.width*0.5, canvas.height*0.2);
  
  // Repeated fireworks
  let fwInterval = setInterval(() => {
    if(document.getElementById('overlaySuccess').style.display === 'flex') {
      launchFirework(Math.random()*canvas.width, Math.random()*canvas.height*0.5);
    } else clearInterval(fwInterval);
  }, 600);

  // Confetti rain
  let confInterval = setInterval(() => {
    if(document.getElementById('overlaySuccess').style.display === 'flex') {
      for(let i=0;i<3;i++) particles.push(new Particle(Math.random()*canvas.width, -10, colors[Math.floor(Math.random()*colors.length)], 'confetti'));
    } else clearInterval(confInterval);
  }, 60);

  function animate() {
    ctx2d.clearRect(0,0, canvas.width, canvas.height);
    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(animate);
  }
  animate();
}

function onSuccess() {
  document.getElementById('wrapper').classList.add('is-success', 'is-open');
  document.getElementById('res-msg').innerText = successMsg;
  playPartySound();
  setTimeout(() => {
    document.getElementById('overlaySuccess').style.display = 'flex';
    startFireworks();
    playApplause();
  }, 1000);
}

// Admin
// Accès enseignant immédiat, sans appui long ni minuterie.
document.getElementById('teacherAccess').addEventListener('click', () => {
  document.getElementById('newCode').value = secretCode;
  document.getElementById('newMsg').value = successMsg;
  document.getElementById('modalAdmin').style.display = 'flex';
  document.getElementById('newCode').focus();
});

function closeAdmin() { document.getElementById('modalAdmin').style.display = 'none'; }
function saveSettings() {
  localStorage.setItem('rasedCode', document.getElementById('newCode').value);
  localStorage.setItem('rasedMsg', document.getElementById('newMsg').value);
  location.reload();
}
</script>
